[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

markers =
    critical: Tests for bugs that break the frontend
    health: Health check tests
    query: RAG pipeline tests
    sources: Source CRUD tests
    pages: Wiki pages tests
    search: Search endpoint tests
    progress: Progress/system stats tests
    graph: Knowledge graph tests
    attention: Attention items tests
    workers: Worker heartbeat tests
    restart: Restart endpoint tests
    apikeys: Admin API keys tests
    cronjobs: Admin cron jobs tests
    chatsessions: Chat session tests
    errors: Error handling tests
    stubs: Stub route availability tests
    contract: Frontend-backend contract tests

addopts = -v --tb=short --strict-markers

# Timeout for each test (requires pytest-timeout)
timeout = 60
