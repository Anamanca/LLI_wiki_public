[project]
name = "llm-wiki"
version = "2.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "redis[hiredis]>=5.0",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings>=2.5",
    "dependency-injector>=4.0",
    "alembic>=1.13",
    "minio",
    "python-telegram-bot>=21.0",
    "yt-dlp>=2024.0",
    "faster-whisper>=1.0",
    "ollama>=0.4",
    "psutil>=5.9",
    "python-dotenv",
    "langsmith>=0.1.0",
    "prometheus-client>=0.21",
    "curl_cffi>=0.13",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "ruff>=0.15,<0.16",
    "mypy",
    "pre-commit",
    "bandit",
    "safety",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# Rules that don't match project conventions:
# B008 — Depends() in FastAPI params is idiomatic (not a bug)
# E402 — conditional imports in query.py avoid circular deps
# F821 — forward-reference type aliases (EntityId, EventId, etc.)
# N818 — DomainException, YouTubeQuotaExceeded are intentional names
# N806 — lowercase var naming in tests for MockClient
ignore = ["B008", "E402", "F821", "N818", "N806"]

[tool.mypy]
strict = false
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
