apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: llm-wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
      - name: copy-node-modules
        image: 32_llm_wiki_clean_arch-frontend:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          cp -r /app/node_modules /deps/node_modules
      - name: wait-for-backend
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for backend..."
          until nc -z backend-v2.llm-wiki.svc.cluster.local 8000; do sleep 3; done
          echo "Backend ready"
      containers:
      - name: frontend
        image: 32_llm_wiki_clean_arch-frontend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: Asia/Ho_Chi_Minh
        - name: NEXT_PUBLIC_API_URL
          value: /api
        - name: HOSTNAME
          value: "0.0.0.0"
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
        volumeMounts:
        - name: source
          mountPath: /app
        - name: deps
          mountPath: /app/node_modules
      volumes:
      - name: source
        hostPath:
          path: /code/frontend
          type: Directory
      - name: deps
        emptyDir: {}
