apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: llm-wiki
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        env:
        - name: POSTGRES_DB
          value: llm_wiki
        - name: POSTGRES_USER
          value: wiki
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: db-password
        - name: TZ
          value: Asia/Ho_Chi_Minh
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: dshm
          mountPath: /dev/shm
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "wiki", "-d", "llm_wiki"]
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "wiki", "-d", "llm_wiki"]
          initialDelaySeconds: 30
          periodSeconds: 30
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
        args:
        - "--web.listen-address=:9187"
        env:
        - name: DATA_SOURCE_URI
          value: "localhost:5432/llm_wiki?sslmode=disable&user=wiki"
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: db-password
        ports:
        - containerPort: 9187
          name: metrics
        resources:
          requests: {memory: "32Mi", cpu: "10m"}
          limits: {memory: "64Mi", cpu: "50m"}
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: pgdata
        hostPath:
          path: /data/postgres
          type: DirectoryOrCreate
