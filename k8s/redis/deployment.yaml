apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: llm-wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: valkey/valkey:8-alpine
        args:
        - valkey-server
        - --appendonly
        - "yes"
        - --appendfsync
        - everysec
        - --save
        - ""
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-data
          mountPath: /data
        readinessProbe:
          exec:
            command: ["valkey-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["valkey-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 30
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.62.0
        args:
        - "--web.listen-address=:9121"
        - "--redis.addr=localhost:6379"
        ports:
        - containerPort: 9121
          name: metrics
        resources:
          requests: {memory: "16Mi", cpu: "5m"}
          limits: {memory: "32Mi", cpu: "20m"}
      volumes:
      - name: redis-data
        hostPath:
          path: /data/redis
          type: DirectoryOrCreate
