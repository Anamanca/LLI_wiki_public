apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:0.5.13
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: "0s"
        - name: TZ
          value: Asia/Ho_Chi_Minh
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: ollamadata
          mountPath: /root/.ollama
        resources:
          limits:
            memory: 8Gi
          requests:
            memory: "4Gi"
            cpu: "1"
        readinessProbe:
          exec:
            command: ["sh", "-c", "ollama list >/dev/null 2>&1"]
          initialDelaySeconds: 30
          periodSeconds: 30
        livenessProbe:
          exec:
            command: ["sh", "-c", "ollama list >/dev/null 2>&1"]
          initialDelaySeconds: 60
          periodSeconds: 60
      volumes:
      - name: ollamadata
        hostPath:
          path: /data/ollama
          type: DirectoryOrCreate
