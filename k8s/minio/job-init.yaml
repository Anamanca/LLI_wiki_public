apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: llm-wiki
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-minio
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until wget -q -O- http://minio.llm-wiki.svc.cluster.local:9000/minio/health/live 2>/dev/null; do
            echo "Waiting for minio..."
            sleep 3
          done
          echo "MinIO is ready"
      containers:
      - name: create-bucket
        image: minio/mc:latest
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: minio-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: minio-password
        command:
        - sh
        - -c
        - |
          mc alias set local http://minio.llm-wiki.svc.cluster.local:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD
          mc mb local/llm-wiki-media --ignore-existing || true
          mc mb local/llm-wiki-backups --ignore-existing || true
          echo 'MinIO buckets initialized'
