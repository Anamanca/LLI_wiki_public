apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: llm-wiki
  labels:
    app: backend-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-v2
  template:
    metadata:
      labels:
        app: backend-v2
    spec:
      serviceAccountName: backend-v2
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for Postgres..."
          until nc -z postgres.llm-wiki.svc.cluster.local 5432; do sleep 3; done
          echo "Postgres ready"
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for Redis..."
          until nc -z redis.llm-wiki.svc.cluster.local 6379; do sleep 2; done
          echo "Redis ready"
      containers:
      - name: backend
        image: 32_llm_wiki_clean_arch-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["uvicorn", "llm_wiki.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
        env:
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: TZ
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: DATABASE_URL
        - name: MINIO_ENDPOINT
          value: minio.llm-wiki.svc.cluster.local:9000
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: MINIO_SECRET_KEY
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: REDIS_PORT
        - name: OLLAMA_HOST
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: OLLAMA_HOST
        - name: YOUTUBE_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: YOUTUBE_API_KEY
        - name: LLM_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: LLM_PROVIDER
        - name: OPENCODE_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: OPENCODE_API_KEY
        - name: OPENCODE_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: OPENCODE_BASE_URL
        - name: OPENCODE_PRIMARY_MODEL
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: OPENCODE_PRIMARY_MODEL
        - name: OPENCODE_FALLBACK_MODEL
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: OPENCODE_FALLBACK_MODEL
        - name: OPENCODE_CHAT_MODEL
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: OPENCODE_CHAT_MODEL
        - name: GEMINI_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: GEMINI_BASE_URL
        - name: GEMINI_PRIMARY_MODEL
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: GEMINI_PRIMARY_MODEL
        - name: GEMINI_FALLBACK_MODEL
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: GEMINI_FALLBACK_MODEL
        - name: GEMINI_CHAT_MODEL
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: GEMINI_CHAT_MODEL
        - name: RERANKER_ENABLED
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: RERANKER_ENABLED
        - name: REASONING_ENABLED
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: REASONING_ENABLED
        - name: RAPIDAPI_KEY
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: RAPIDAPI_KEY
        - name: LANGSMITH_TRACING
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: LANGSMITH_TRACING
        - name: LANGSMITH_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: LANGSMITH_ENDPOINT
        - name: LANGSMITH_PROJECT
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: LANGSMITH_PROJECT
        - name: LANGSMITH_EVALUATOR_MODEL
          valueFrom:
            configMapKeyRef:
              name: llm-wiki-config
              key: LANGSMITH_EVALUATOR_MODEL
        - name: LANGSMITH_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-wiki-secrets
              key: LANGSMITH_API_KEY
        - name: ENABLE_STUB_ROUTES
          value: "true"
        - name: CHAT_HISTORY_DIR
          value: "/data/chat-history"
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
        volumeMounts:
        - name: chat-history
          mountPath: /data/chat-history
      volumes:
      - name: chat-history
        hostPath:
          path: /data/chat-history
          type: DirectoryOrCreate
