apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-v2
  namespace: llm-wiki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-v2-cronjob-reader
  namespace: llm-wiki
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-v2-cronjob-reader
  namespace: llm-wiki
subjects:
  - kind: ServiceAccount
    name: backend-v2
    namespace: llm-wiki
roleRef:
  kind: Role
  name: backend-v2-cronjob-reader
  apiGroup: rbac.authorization.k8s.io
