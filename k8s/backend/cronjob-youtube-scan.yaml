apiVersion: batch/v1
kind: CronJob
metadata:
  name: youtube-daily-scan
  namespace: llm-wiki
spec:
  schedule: "1 1 * * *"  # 8:01 AM ICT = 1:01 UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: trigger
            image: busybox:1.36
            command:
            - sh
            - -c
            - |
              URL="http://cpu-worker.llm-wiki.svc.cluster.local:8100/api/admin/cron-jobs/youtube-daily-scan/start"
              echo "[$(date)] Triggering daily YouTube scan: $URL"
              for i in 1 2 3 4 5; do
                echo "[$(date)] Attempt $i/5: $URL"
                RC=$(wget -q -O - --timeout=30 --tries=1 --post-data="" "$URL" > /tmp/resp 2>&1; echo $?)
                if [ "$RC" -eq 0 ]; then
                  echo "[$(date)] Scan triggered successfully"
                  cat /tmp/resp
                  exit 0
                fi
                echo "[$(date)] Attempt $i failed (rc=$RC), retrying in 30s"
                sleep 30
              done
              echo "[$(date)] All attempts failed"
              cat /tmp/resp 2>/dev/null || true
              exit 1
            resources:
              requests:
                memory: "16Mi"
                cpu: "10m"
