apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: llm-wiki
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: node-exporter
        image: quay.io/prometheus/node-exporter:v1.8.2
        args:
        - "--path.rootfs=/host"
        - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
        - "--collector.diskstats.device-exclude=^(ram|loop|fd|sr|nbd)($$|/)"
        ports:
        - containerPort: 9100
          hostPort: 9100
          name: metrics
        volumeMounts:
        - name: host
          mountPath: /host
          readOnly: true
          mountPropagation: HostToContainer
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: host
        hostPath:
          path: /
      tolerations:
      - operator: Exists
