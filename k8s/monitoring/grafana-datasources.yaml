apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: llm-wiki
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus.llm-wiki.svc.cluster.local:9090
      access: proxy
      isDefault: true
      editable: false
    - name: Loki
      type: loki
      url: http://loki.llm-wiki.svc.cluster.local:3100
      access: proxy
      editable: false
