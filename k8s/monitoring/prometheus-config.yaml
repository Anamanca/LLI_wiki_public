apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: llm-wiki
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['alertmanager.llm-wiki.svc.cluster.local:9093']

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
    - job_name: 'backend-v2'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [llm-wiki]
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)

    - job_name: 'postgres'
      static_configs:
      - targets: ['postgres.llm-wiki.svc.cluster.local:9187']
        labels:
          app: postgres

    - job_name: 'redis'
      static_configs:
      - targets: ['redis.llm-wiki.svc.cluster.local:9121']
        labels:
          app: redis
