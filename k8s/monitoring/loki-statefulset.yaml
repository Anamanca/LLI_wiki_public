apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: llm-wiki
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
    limits_config:
      retention_period: 168h
      max_entries_limit_per_query: 5000
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /etc/loki/rules
      alertmanager_url: http://alertmanager.llm-wiki.svc.cluster.local:9093
      ring:
        kvstore:
          store: inmemory
      enable_api: true
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: llm-wiki
spec:
  replicas: 1
  serviceName: loki
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      serviceAccountName: default
      containers:
      - name: loki
        image: grafana/loki:3.1.0
        args: ["-config.file=/etc/loki/loki.yaml"]
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: data
          mountPath: /loki
        - name: ruler-config
          mountPath: /etc/loki/rules
          readOnly: true
        resources:
          requests: {memory: "128Mi", cpu: "50m"}
          limits: {memory: "512Mi", cpu: "200m"}
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: ruler-config
        configMap:
          name: loki-alert-rules
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: llm-wiki
spec:
  type: NodePort
  selector: {app: loki}
  ports:
  - port: 3100
    targetPort: 3100
    nodePort: 30310
