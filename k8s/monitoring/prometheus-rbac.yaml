apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: llm-wiki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-llm-wiki
rules:
- apiGroups: [""]
  resources: ["pods", "endpoints", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-llm-wiki
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-llm-wiki
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: llm-wiki
