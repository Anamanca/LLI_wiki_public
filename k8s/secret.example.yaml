apiVersion: v1
kind: Secret
metadata:
  name: llm-wiki-secrets
  namespace: llm-wiki
type: Opaque
stringData:
  # PostgreSQL
  db-password: "CHANGE_ME"
  DATABASE_URL: "postgresql+asyncpg://wiki:CHANGE_ME@postgres.llm-wiki.svc.cluster.local:5432/llm_wiki"

  # MinIO
  minio-user: "CHANGE_ME"
  minio-password: "CHANGE_ME"
  MINIO_ACCESS_KEY: "CHANGE_ME"
  MINIO_SECRET_KEY: "CHANGE_ME"

  # External data sources
  YOUTUBE_API_KEY: "CHANGE_ME"
  RAPIDAPI_KEY: "CHANGE_ME"

  # LLM providers
  OPENCODE_API_KEY: "CHANGE_ME"
  GEMINI_API_KEY: "CHANGE_ME"

  # LangSmith observability & evaluation
  LANGSMITH_API_KEY: "CHANGE_ME"

  # Telegram bot (optional)
  TELEGRAM_BOT_TOKEN: "CHANGE_ME"
  ALLOWED_TELEGRAM_CHAT_IDS: "CHANGE_ME"
