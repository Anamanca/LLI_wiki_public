apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-wiki-ingress
  namespace: llm-wiki
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: llm-wiki.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-v2
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
